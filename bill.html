<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf3f4" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'" />
    <title>黄建皇开销明细｜2026 欧洲旅行回忆录</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="bill.css" />
    <link rel="stylesheet" href="password-gate.css" />
  </head>
  <body class="password-gate-locked">
    <section class="password-gate" aria-labelledby="passwordGateTitle">
      <div class="password-gate__panel">
        <p class="password-gate__eyebrow">Private memoir</p>
        <h1 id="passwordGateTitle">进入回忆录</h1>
        <p class="password-gate__prompt">这个网站是谁做的？</p>
        <form>
          <label for="passwordGateAnswer">答案
            <input id="passwordGateAnswer" name="answer" type="text" autocomplete="off" required />
          </label>
          <button type="submit">进入</button>
          <p class="password-gate__status" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <header class="bill-hero">
      <nav class="bill-topbar" aria-label="账单导航">
        <a class="bill-back" href="./index.html?role=jianhuang#tripMemory">回忆录</a>
        <span aria-current="page">开销明细</span>
      </nav>
      <div class="bill-hero__content">
        <p class="bill-eyebrow">Travel ledger · 2026</p>
        <h1>黄建皇开销明细</h1>
        <p>94 笔开销，按类别和日期汇总。</p>
      </div>
    </header>

    <main class="bill-shell">
      <section class="bill-note" aria-label="账单口径">
        <strong>统计口径</strong>
        <p>合计 ¥29,712.53。Havfruen 午餐 ¥532.07 计一次；Icewear 退税 ¥72 已扣除；朋友代付按确认金额计入。</p>
      </section>

      <section class="bill-kpis" id="billSummary" aria-label="账单摘要" aria-live="polite"></section>

      <section class="bill-panel bill-ledger-panel" aria-labelledby="ledgerTitle">
        <div class="bill-section-head">
          <div>
            <p class="bill-eyebrow">Ledger</p>
            <h2 id="ledgerTitle">四类开销</h2>
          </div>
          <p id="billResultCount">加载中…</p>
        </div>
        <div class="bill-toolbar" aria-label="账单筛选与操作">
          <div class="bill-filter-row" role="group" aria-label="账单状态筛选">
            <button class="bill-filter is-active" type="button" data-filter="all">全部</button>
            <button class="bill-filter" type="button" data-filter="confirmed">已确认</button>
            <button class="bill-filter" type="button" data-filter="needs-confirmation">待确认</button>
            <button class="bill-filter" type="button" data-filter="missing">待补</button>
            <button class="bill-filter" type="button" data-filter="refunded">退款</button>
            <button class="bill-filter" type="button" data-filter="local">本机新增</button>
          </div>
          <div class="bill-actions">
            <button class="bill-action bill-action--primary" id="toggleAddBill" type="button" aria-expanded="false" aria-controls="addBillPanel">新增</button>
            <button class="bill-action" id="exportBill" type="button">导出</button>
            <button class="bill-action bill-action--quiet" id="clearLocalBills" type="button">清空本机</button>
          </div>
        </div>
        <div class="bill-add-panel" id="addBillPanel" hidden>
          <form id="addBillForm" novalidate>
            <div class="bill-form-grid">
              <label>日期<input name="date" type="text" placeholder="10/06" required /></label>
              <label>类别<select name="category"><option>交通</option><option>住宿</option><option>团费</option><option>餐饮</option><option>门票</option><option>其他</option></select></label>
              <label class="bill-form-wide">项目<input name="title" type="text" placeholder="例如：机场公交" required /></label>
              <label>金额<input name="amount" type="number" min="0" step="0.01" placeholder="可留空" /></label>
              <label>币种<select name="currency"><option value="CNY">人民币 ¥</option><option value="EUR">欧元 €</option><option value="ISK">冰岛克朗 ISK</option></select></label>
              <label>建皇应摊<input name="shareAmount" type="number" min="0" step="0.01" placeholder="可留空" /></label>
              <label class="bill-form-wide">备注<input name="note" type="text" placeholder="可选：付款人、分摊规则或凭证说明" /></label>
            </div>
            <div class="bill-form-actions">
              <button class="bill-action bill-action--primary" type="submit">保存到本机</button>
              <button class="bill-action" id="cancelAddBill" type="button">取消</button>
              <span id="billFormStatus" role="status" aria-live="polite"></span>
            </div>
          </form>
        </div>
        <div class="bill-list" id="billList" aria-live="polite"></div>
      </section>

      <section class="bill-panel" aria-labelledby="itineraryTitle">
        <div class="bill-section-head">
          <div>
            <p class="bill-eyebrow">Cross-reference</p>
            <h2 id="itineraryTitle">按日期回看</h2>
          </div>
          <p>照片、地点和当天花费。</p>
        </div>
        <div class="bill-itinerary" id="billItinerary"></div>
      </section>

      <section class="bill-panel bill-footnote" aria-label="保存说明">
        <strong>本机保存</strong>
        <p>新增记录只存于当前浏览器；可导出 CSV。</p>
      </section>
    </main>

    <footer class="bill-footer">
      <a href="./index.html?role=jianhuang#tripMemory">回忆录</a>
      <a href="./bill.html#jianhuang" aria-current="page">开销明细</a>
      <a href="./index.html?role=jianhuang#lodging-expenses">住宿开销</a>
    </footer>

    <script src="memory-data.js?v=memory-20261014-2" defer></script>
    <script src="bill-data.js?v=memory-20261014-2" defer></script>
    <script src="bill.js" defer></script>
    <script src="password-gate.js" defer></script>
  </body>
</html>
